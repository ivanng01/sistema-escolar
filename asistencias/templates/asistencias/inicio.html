{% extends 'base.html' %}

{% block title %}
    Inicio
{% endblock %}

{% block content %}

<div class="container py-4">

    <h1 class="text-center mb-2">
    Sistema de Gestión Escolar
    </h1>

    <div class="row g-4 justify-content-center">

        <div class="col-12 col-lg-6">

            <a
                href="/cursos/"
                class="text-decoration-none">

                <div class="card shadow-sm border-0 text-center p-4 h-100">

                    <i class="bi bi-calendar-check fs-1 text-primary mb-3"></i>

                    <h3 class="mb-2 text-dark">
                        Asistencia
                    </h3>

                    <p class="texto-secundario mb-0">
                        Registrar y consultar asistencias.
                    </p>

                </div>

            </a>

        </div>

        <div class="col-12 col-lg-6">

            <a
                href="/observaciones/"
                class="text-decoration-none">

                <div class="card shadow-sm border-0 text-center p-4 h-100">

                    <i class="bi bi-journal-text fs-1 mb-3"></i>

                    <h3 class="mb-2 text-dark">
                        Observaciones
                    </h3>

                    <p class="texto-secundario mb-0">
                        Registrar observaciones de alumnos.
                    </p>

                </div>

            </a>

        </div>

        <div class="col-12 col-lg-6">

            <a
                href="/consultas/"
                class="text-decoration-none">

                <div class="card shadow-sm border-0 text-center p-4 h-100">

                    <i class="bi bi-search fs-1 text-success mb-3"></i>

                    <h3 class="mb-2 text-dark">
                        Consultas
                    </h3>

                    <p class="texto-secundario mb-0">
                        Consultar información registrada.
                    </p>

                </div>

            </a>

        </div>

    </div>

</div>

{% endblock %}
