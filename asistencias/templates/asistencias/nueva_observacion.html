{% extends 'base.html' %}

{% block title %}
    Editar observación
{% endblock %}

{% block content %}

<h1 class="mb-4 text-center">
    Nueva observación
</h1>


<div class="card shadow-sm p-4 col-12 col-md-8 mx-auto">

    <div class="mb-3">
        <p class="fs-5 mb-2">
        <strong>Alumno:</strong>
        {{ alumno.nombre }}
        {{ alumno.apellido }}
        </p>
    </div>

    <div class="mb-3">

        <p class="fs-5 mb-2">
        <strong>Curso:</strong>
            {{ curso.nombre }}
            {{ curso.escuela }}
        </p>
    </div>

    <form method="post">

    {% csrf_token %}

    <textarea
                name="descripcion"
                rows="5"
                class="form-control"
                required>{{ observacion.descripcion }}
            </textarea>

    <br>

    <button
                type="submit"
                class="btn btn-primary">

                Guardar cambios

    </button>

    <a
                href="/observaciones/lista/{{ curso.id }}/"
                class="btn btn-secondary">
                Volver
    </a>
</form>

</div>

{% endblock %}
